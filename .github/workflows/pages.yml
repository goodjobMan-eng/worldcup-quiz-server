name: NATIONLAB 정적 웹앱 배포
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: nationlab-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            월드컵-본선-진출국-탐구-퀴즈/package-lock.json
      - run: npm ci
      - run: npm --prefix 월드컵-본선-진출국-탐구-퀴즈 ci
      - run: npm run lint && npm test && npm run simulate
      - run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 월드컵-본선-진출국-탐구-퀴즈/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 정적 웹앱 배포
        id: deployment
        uses: actions/deploy-pages@v4
